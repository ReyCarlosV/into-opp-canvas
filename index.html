<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Intro Canvas 2D</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/image/circle-1.png">

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <!-- Header -->
    <header class="bg-primary text-white text-center py-4 shadow">
        <h1 class="fw-bold">Objetos 2D con Canvas y OOP</h1>
        <p class="mb-0">Ejemplo de uso de Canvas utilizando Programación Orientada a Objetos</p>
    </header>

    <main class="container my-5">

        <div class="row g-4">

            <!-- Canvas OOP -->
            <div class="col-md-4">
                <div class="card shadow-lg card-canvas h-100">
                    <div class="card-body text-center">
                        <h5 class="card-title">Objeto 2D</h5>
                        <canvas class="canvas-style" id="canvasOOP"></canvas>
                    </div>
                </div>
            </div>

            <!-- Canvas Random -->
            <div class="col-md-4">
                <div class="card shadow-lg card-canvas h-100">
                    <div class="card-body text-center">
                        <h5 class="card-title">Objeto con Random</h5>
                        <canvas class="canvas-style" id="canvasRandom"></canvas>
                    </div>
                </div>
            </div>

            <!-- Canvas Multiple -->
            <div class="col-md-4">
                <div class="card shadow-lg card-canvas h-100">
                    <div class="card-body text-center">
                        <h5 class="card-title">Múltiples objetos</h5>
                        <canvas class="canvas-style" id="canvasMultiple"></canvas>
                    </div>
                </div>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-3 bg-light border-top">
        <small>Canvas 2D • Programación Orientada a Objetos</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>

</body>

</html>
